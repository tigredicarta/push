name: Daily HF Spaces factory rebuild
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Rebuild Koyeb app
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          cat > /tmp/koyeb_redeploy.py << PYEOF
          import os, urllib.request, json

          headers = {
              "Authorization": f"Bearer {os.environ['KOYEB_API_TOKEN']}",
              "Content-Type": "application/json"
          }

          req = urllib.request.Request("https://app.koyeb.com/v1/apps", headers=headers)
          apps = json.loads(urllib.request.urlopen(req).read())["apps"]
          app = next(a for a in apps if a["name"] == "bumpy-thea")
          app_id = app["id"]
          print(f"App ID: {app_id}")

          req = urllib.request.Request(f"https://app.koyeb.com/v1/services?app_id={app_id}", headers=headers)
          services = json.loads(urllib.request.urlopen(req).read())["services"]
          svc = next(s for s in services if s["name"] == "easyproxy")
          svc_id = svc["id"]
          print(f"Service ID: {svc_id}")

          data = json.dumps({"skip_build": False}).encode()
          req = urllib.request.Request(
              f"https://app.koyeb.com/v1/services/{svc_id}/redeploy",
              data=data, headers=headers, method="POST"
          )
          resp = json.loads(urllib.request.urlopen(req).read())
          print(f"Redeploy triggerato: {resp}")
          PYEOF
          python3 /tmp/koyeb_redeploy.py
