name: Daily HF Spaces factory rebuild
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install huggingface_hub
        run: pip install -U huggingface_hub

      - name: Factory reboot tigredicarta spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          for repo in [
              "tigredicarta/prprprpr",
              "tigredicarta/tiririrorir",
              "tigredicarta/xoti",
          ]:
              api.restart_space(repo_id=repo, factory_reboot=True)
              print(f"Triggered {repo}")
          EOF

      - name: Factory reboot catedicar spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN_CATEDICARTA }}
        run: |
          python - <<'EOF'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          for repo in [
              "catedicar/prprprpr",
          ]:
              api.restart_space(repo_id=repo, factory_reboot=True)
              print(f"Triggered {repo}")
          EOF

      - name: Rebuild Koyeb app
        env:
          KOYEB_API_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          # Recupera l'ID del deployment attivo per l'app
          APP_URL="https://bumpy-thea-dvoa-165fc44b.koyeb.app"
          APP_NAME="dvoa"

          DEPLOYMENT_ID=$(curl -s -X GET "https://app.koyeb.com/v1/deployments?app_name=${APP_NAME}&statuses=HEALTHY" \
            -H "Authorization: Bearer ${KOYEB_API_TOKEN}" \
            | python3 -c "import sys,json; deps=json.load(sys.stdin).get('deployments',[]); print(deps[0]['id'] if deps else '')")

          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Nessun deployment attivo trovato per ${APP_NAME}"
            exit 1
          fi

          echo "Trovato deployment: $DEPLOYMENT_ID"

          # Triggera il redeploy
          curl -s -X POST "https://app.koyeb.com/v1/deployments/${DEPLOYMENT_ID}/redeploy" \
            -H "Authorization: Bearer ${KOYEB_API_TOKEN}" \
            -H "Content-Type: application/json" \
            | python3 -c "import sys,json; r=json.load(sys.stdin); print('Redeploy triggerato:', r)"
